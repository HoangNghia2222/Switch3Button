<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3-Gang Switch IFrame</title>
<style>
  :root{
    --bg:#f5f7fb; --plate:#ffffff; --stroke:#d5d9e2;
    --text:#0f172a; --muted:#64748b;
    --on:#22c55e; --off:#94a3b8;
    --ind-on:#3b82f6; --ind-off:#cbd5e1;
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;}
  .wrap{height:100%;display:grid;place-items:center;padding:8px;}
  .panel{
    width:min(92vw,420px); aspect-ratio:1/1; background:var(--plate);
    border-radius:14px; box-shadow:0 6px 22px rgba(2,6,23,.12);
    display:grid; grid-template-columns:repeat(3,1fr); overflow:hidden;
    border:1px solid var(--stroke);
  }
  .key{
    position:relative; display:grid; grid-template-rows:1fr auto 16px; align-items:end;
    border-left:1px solid var(--stroke);
    transition:background 0.2s;
  }
  .key:first-child{border-left:none;}
  .btn{
    margin:14px; border-radius:10px; border:1px solid var(--stroke);
    background:linear-gradient(#ffffff,#f3f6fb);
    box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(15,23,42,.08);
    cursor:pointer; outline:none; transition:all .15s ease;
    height:90%;
  }
  .btn:active{transform:scale(0.98);}
  .label{
    text-align:center; font-size:14px; color:var(--muted); margin-bottom:8px;
    letter-spacing:.3px; user-select:none;
  }
  .dot{
    height:4px; width:24px; border-radius:999px; margin:0 auto 12px;
    background:var(--ind-off); transition:background-color .18s ease;
  }
  /* ON state visuals */
  .key.on .btn{background:linear-gradient(#d9ffe7,#afffcb); border-color:#b7efc5;}
  .key.on .label{color:var(--on); font-weight:600;}
  .key.on .dot{background:var(--ind-on);}
  .btn:focus-visible{box-shadow:0 0 0 3px rgba(59,130,246,.35);}
  .head{
    position:absolute; top:8px; right:12px; color:#94a3b8; font-size:11px; letter-spacing:.2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel" id="panel">
    <div class="head">
      <span id="deviceId">device-unknown</span>
    </div>

    <div class="key" id="sw1">
      <button class="btn" id="btn-sw1">1</button>
      <div class="label" id="status-sw1">OFF</div>
      <div class="dot"></div>
    </div>

    <div class="key" id="sw2">
      <button class="btn" id="btn-sw2">2</button>
      <div class="label" id="status-sw2">OFF</div>
      <div class="dot"></div>
    </div>

    <div class="key" id="sw3">
      <button class="btn" id="btn-sw3">3</button>
      <div class="label" id="status-sw3">OFF</div>
      <div class="dot"></div>
    </div>
  </div>
</div>
<script src="https://www.unpkg.com/@eohjsc/era-widget@1.1.3/src/index.js"></script>
<script>
  const switches = ["sw1", "sw2", "sw3"];
  const state = { sw1:false, sw2:false, sw3:false };

  function render(id){
    const key = document.getElementById(id);
    const status = document.getElementById(`status-${id}`);
    const on = state[id];
    key.classList.toggle("on", on);
    status.textContent = on ? "ON" : "OFF";
  }

  function toggle(id){
    state[id] = !state[id];
    render(id);
    window.parent?.postMessage({type:"era:command", id, value:state[id]}, "*");
  }

  switches.forEach(id=>{
    document.getElementById(`btn-${id}`).addEventListener("click", ()=>toggle(id));
    render(id);
  });

  window.addEventListener("message",(event)=>{
    const msg = event.data||{};
    if(msg.type==="era:update" && switches.includes(msg.id)){
      state[msg.id]=!!msg.value; render(msg.id);
    }
    if(msg.type==="era:batch" && msg.data){
      switches.forEach(k=>{if(k in msg.data){state[k]=!!msg.data[k];render(k);}});
      if(msg.deviceId) document.getElementById("deviceId").textContent=msg.deviceId;
    }
  });

// Thay thế biến đơn:
// let configLed = null, newStatusLed = null, actions = [];

// Bằng các biến để lưu cấu hình, trạng thái và hành động cho từng switch
const switchConfigs = {}; // Lưu config cho sw1, sw2, sw3
const switchStates = { sw1: null, sw2: null, sw3: null }; // Lưu trạng thái hiện tại (0/1)
const switchActions = {}; // Lưu actions (Bật/Tắt) cho từng switch (nếu có)

// --- Khởi tạo EraWidget ---
const eraWidget = new EraWidget();
eraWidget.init({
    needRealtimeConfigs: true,
    needHistoryConfigs: true,
    needActions: true,
    maxRealtimeConfigsCount: 3, // Cần 3 để lấy trạng thái cho 3 switch
    maxActionsCount: 6, // Ví dụ: 3 switch * 2 hành động/switch (Bật/Tắt)
    minRealtimeConfigsCount: 0,        /* Số lượng tối thiểu giá trị hiện thời */
    minHistoryConfigsCount: 0,         /* Số lượng tối thiểu giá trị lịch sử */
    minActionsCount: 0,                /* Số lượng tối thiểu hành động */
    // ... các thiết lập minCount khác giữ nguyên
    
    onConfiguration: (configuration) => {
        // Ánh xạ realtime config cho từng switch (Giả sử config 0, 1, 2 lần lượt là sw1, sw2, sw3)
        switches.forEach((id, index) => {
            switchConfigs[id] = configuration.realtime_configs[index];
            // Bạn cần logic để ánh xạ actions cụ thể cho từng switch nếu actions là chung
            // Hiện tại: Giả sử hành động Bật/Tắt là chung cho cả 3 switch và được lưu trong configuration.actions
        });
        // Lưu toàn bộ actions (sẽ dùng chung nếu server không phân biệt action cho từng switch)
        switchActions.all = configuration.actions; 
    },

    onValues: (values) => {
        switches.forEach(id => {
            const config = switchConfigs[id];
            if (config && values[config.id]) {
                const state = values[config.id].value;
                if (switchStates[id] !== state) {
                    switchStates[id] = state;
                    updateSwitch(id, state); // Gửi cả ID của switch vào
                }
            }
        });
    },
});


  
// --- Hàm cập nhật giao diện (Quan trọng nhất) ---
function updateSwitch(id, state) { // Thêm tham số id
    const key = document.getElementById(id); // Lấy key tương ứng
    const label = document.getElementById(`status-${id}`); // Lấy label tương ứng

    if(state === 1){
        key.classList.add("on");
        label.textContent = "ON";
    } else {
        key.classList.remove("on");
        label.textContent = "OFF";
    }
}
 
// --- Logic click cho từng nút ---

// Hành động Bật/Tắt cần phải được ánh xạ đúng từ switchActions.all
// Giả định actions[0] là Bật, actions[1] là Tắt cho tất cả.
btn_sw1.addEventListener('click', () => {
    const actionIndex = switchStates.sw1 === 1 ? 1 : 0; // 1: Tắt, 0: Bật
    eraWidget.triggerAction(switchActions.all[actionIndex]?.action, null);
});

btn_sw2.addEventListener('click', () => {
    const actionIndex = switchStates.sw2 === 1 ? 1 : 0; // 1: Tắt, 0: Bật
    eraWidget.triggerAction(switchActions.all[actionIndex]?.action, null);
});

btn_sw3.addEventListener('click', () => {
    const actionIndex = switchStates.sw3 === 1 ? 1 : 0; // 1: Tắt, 0: Bật
    eraWidget.triggerAction(switchActions.all[actionIndex]?.action, null);
});

// ***LƯU Ý QUAN TRỌNG***
// Nếu nền tảng của bạn gửi các hành động (actions) khác nhau cho mỗi switch, 
// bạn cần điều chỉnh logic onConfiguration để lưu các action tương ứng với từng switch 
// và sử dụng chúng trong sự kiện click.
// (Ví dụ: switchActions[id].on và switchActions[id].off)


  
</script>
</body>
</html>
